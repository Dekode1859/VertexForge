<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VertexForge OSS - Multi-Agent Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0A0A0A;
            --bg-surface: #111111;
            --bg-card: #1A1A1A;
            --bg-hover: #232323;
            --bg-input: #141414;
            --border: #2A2A2A;
            --border-focus: #4A4A4A;
            --border-accent: #334155;
            --text-primary: #F0F0F0;
            --text-secondary: #A0A0A0;
            --text-muted: #6B7280;
            --text-accent: #818CF8;
            --accent-blue: #60A5FA;
            --accent-purple: #A78BFA;
            --accent-green: #34D399;
            --accent-red: #F87171;
            --accent-yellow: #FBBF24;
            --accent-orange: #F97316;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, Monaco, monospace;
            --shadow-card: 0 1px 3px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.03);
            --shadow-elevated: 0 4px 20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            min-height: 100%;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        /* Layout */
        .app-layout {
            display: grid;
            grid-template-columns: 1fr 500px;
            min-height: 100vh;
        }

        @media (max-width: 1100px) {
            .app-layout { grid-template-columns: 1fr; }
        }

        .panel {
            padding: 24px;
        }

        .left-panel {
            border-right: 1px solid var(--border);
        }

        .right-panel {
            background: var(--bg-surface);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        /* Header */
        .app-header {
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .app-header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header h1::before {
            content: '';
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 6px;
            display: inline-block;
        }

        .app-header p {
            color: var(--text-secondary);
            font-size: 13px;
            margin-top: 4px;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header h2 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-header h2 .icon {
            color: var(--text-accent);
            font-size: 16px;
        }

        .card-body {
            padding: 20px;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group:last-child { margin-bottom: 0; }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
            font-family: var(--font-sans);
            transition: var(--transition);
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--border-focus);
            background: #181818;
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.08);
        }

        textarea {
            min-height: 80px;
            resize: vertical;
            font-family: var(--font-sans);
        }

        textarea.mono,
        .mono {
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.6;
        }

        /* Row */
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: var(--font-sans);
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4F46E5, #7C3AED);
            color: white;
            border: none;
            box-shadow: 0 1px 3px rgba(79, 70, 229, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg-card);
            color: var(--text-primary);
            border-color: var(--border-focus);
        }

        .btn-danger {
            background: rgba(248, 113, 113, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        .btn-danger:hover {
            background: rgba(248, 113, 113, 0.15);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-block { width: 100%; }

        /* Action groups */
        .action-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Node Card */
        .node-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 12px;
            position: relative;
            transition: var(--transition);
        }

        .node-card:hover {
            border-color: var(--border-focus);
            box-shadow: var(--shadow-elevated);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .node-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 600;
            color: var(--text-accent);
        }

        .node-badge .number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: rgba(129, 140, 248, 0.15);
            border-radius: 5px;
            font-size: 11px;
        }

        /* Tools grid */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .tool-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 12.5px;
            color: var(--text-secondary);
            user-select: none;
        }

        .tool-toggle:hover {
            background: var(--bg-hover);
            border-color: var(--border-focus);
            color: var(--text-primary);
        }

        .tool-toggle input[type="checkbox"] {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-focus);
            border-radius: 4px;
            background: var(--bg-card);
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .tool-toggle input[type="checkbox"]:checked {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .tool-toggle input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 4px;
            top: 1px;
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        /* Pipeline list */
        .pipeline-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
        }

        .pipeline-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .pipeline-item:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }

        .pipeline-item.active {
            background: rgba(79, 70, 229, 0.08);
            border-color: rgba(79, 70, 229, 0.25);
        }

        .pipeline-item.active .pipeline-name { color: var(--text-accent); }

        .pipeline-name {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 13px;
        }

        .pipeline-date {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 1px;
        }

        /* Right Panel - Execution */
        .execution-panel {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .execution-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg-surface);
        }

        .execution-header h3 {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .status-idle {
            background: rgba(107, 114, 128, 0.1);
            color: var(--text-muted);
            border: 1px solid rgba(107, 114, 128, 0.2);
        }

        .status-running {
            background: rgba(96, 165, 250, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        .status-complete {
            background: rgba(52, 211, 153, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .status-error {
            background: rgba(248, 113, 113, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-running .status-dot {
            background: var(--accent-blue);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .status-complete .status-dot { background: var(--accent-green); }

        .status-error .status-dot { background: var(--accent-red); }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .execution-log {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-height: 0;
        }

        .log-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            gap: 12px;
        }

        .log-empty-icon {
            width: 48px;
            height: 48px;
            border: 2px dashed var(--border);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            opacity: 0.5;
        }

        /* Step cards */
        .step-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-header-bar {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            gap: 10px;
            font-size: 12.5px;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        .step-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .step-icon.running {
            background: rgba(96, 165, 250, 0.12);
            color: var(--accent-blue);
        }

        .step-icon.complete {
            background: rgba(52, 211, 153, 0.12);
            color: var(--accent-green);
        }

        .step-icon.error {
            background: rgba(248, 113, 113, 0.12);
            color: var(--accent-red);
        }

        .step-icon.info {
            background: rgba(129, 140, 248, 0.12);
            color: var(--text-accent);
        }

        .step-title { flex: 1; }

        .step-meta {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .step-body {
            padding: 12px 14px;
            font-size: 12.5px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Tool Call Card */
        .tool-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
            animation: slideIn 0.25s ease-out;
        }

        .tool-card.running {
            border-color: rgba(96, 165, 250, 0.3);
            box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.05), 0 2px 8px rgba(96, 165, 250, 0.06);
        }

        .tool-card.success {
            border-color: rgba(52, 211, 153, 0.2);
        }

        .tool-card.error {
            border-color: rgba(248, 113, 113, 0.2);
        }

        .tool-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 12.5px;
            font-weight: 600;
        }

        .tool-icon {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }

        .tool-icon.running {
            background: rgba(96, 165, 250, 0.15);
            color: var(--accent-blue);
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        .tool-icon.success {
            background: rgba(52, 211, 153, 0.15);
            color: var(--accent-green);
        }

        .tool-icon.error {
            background: rgba(248, 113, 113, 0.15);
            color: var(--accent-red);
        }

        .tool-name {
            flex: 1;
            color: var(--text-primary);
        }

        .tool-status-label {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .tool-status-label.running {
            background: rgba(96, 165, 250, 0.12);
            color: var(--accent-blue);
        }

        .tool-status-label.success {
            background: rgba(52, 211, 153, 0.12);
            color: var(--accent-green);
        }

        .tool-status-label.error {
            background: rgba(248, 113, 113, 0.12);
            color: var(--accent-red);
        }

        .tool-body {
            padding: 12px 14px;
        }

        .tool-param {
            margin-bottom: 12px;
        }

        .tool-param:last-child { margin-bottom: 0; }

        .tool-param-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .tool-param-value {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 12px;
            font-family: var(--font-mono);
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-secondary);
            overflow-wrap: anywhere;
            word-break: break-word;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
        }

        .tool-param-value pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: inherit;
            font-size: inherit;
            overflow-wrap: anywhere;
        }

        .tool-toggle-raw {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding: 4px 10px;
            background: var(--bg-hover);
            border: 1px solid var(--border);
            border-radius: 5px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .tool-toggle-raw:hover {
            background: var(--bg-card);
            color: var(--text-secondary);
            border-color: var(--border-focus);
        }

        .tool-raw-output {
            margin-top: 8px;
            display: none;
        }

        .tool-raw-output.expanded { display: block; }

        .tool-raw-output .tool-param-value {
            max-height: 400px;
            background: #0F1117;
            border-color: #2A2D35;
            color: #ABB2BF;
        }

        /* Final Output */
        .final-output-card {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.05), rgba(96, 165, 250, 0.05));
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-top: 4px;
        }

        .final-output-card .final-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .final-output-card .final-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-green);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .final-meta {
            font-size: 11px;
            color: var(--text-muted);
        }

        .final-body {
            font-size: 13.5px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .final-body p { margin-bottom: 10px; }
        .final-body ul { padding-left: 20px; margin-bottom: 10px; }

        /* Empty / Loading */
        .log-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--text-muted);
            font-size: 13px;
            padding: 40px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="app-layout">
        <!-- LEFT PANEL -->
        <div class="panel left-panel">
            <header class="app-header">
                <h1>VertexForge <span style="color: var(--text-secondary); font-weight: 400;">OSS</span></h1>
                <p>Build Linear Multi-Agent Systems Without Code</p>
            </header>

            <!-- Saved Pipelines -->
            <div class="card">
                <div class="card-header">
                    <h2><span class="icon">&#9776;</span> Saved Pipelines</h2>
                </div>
                <div class="card-body" style="padding: 8px;">
                    <div class="pipeline-list" id="pipeline-list">
                        <div class="log-loading">Loading...</div>
                    </div>
                </div>
            </div>

            <!-- Pipeline Builder -->
            <div class="card">
                <div class="card-header">
                    <h2><span class="icon">&#9998;</span> Pipeline Builder</h2>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Pipeline Name</label>
                        <input type="text" id="pipeline-name" placeholder="e.g., Research Assistant">
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="pipeline-desc" placeholder="What does this pipeline do?"></textarea>
                    </div>

                    <div class="form-group">
                        <label style="margin-bottom: 12px;">Agent Nodes</label>
                        <div id="nodes-container"></div>
                        <button type="button" class="btn btn-secondary btn-block" style="margin-top: 12px;" onclick="addNode()">
                            + Add Agent Node
                        </button>
                    </div>

                    <div class="form-group">
                        <label>Test Input</label>
                        <textarea id="test-input" class="mono" placeholder="Enter input for your pipeline...">What are the latest developments in AI?</textarea>
                    </div>

                    <div class="action-group">
                        <button type="button" class="btn btn-secondary" onclick="loadExample(1)">Load Example 1</button>
                        <button type="button" class="btn btn-secondary" onclick="loadExample(2)">Load Example 2</button>
                        <button type="button" class="btn btn-secondary" onclick="loadExample(3)">Load Example 3</button>
                    </div>

                    <div class="action-group" style="margin-top: 16px;">
                        <button type="button" class="btn btn-primary" style="flex: 2;" onclick="saveAndExecute()">
                            &#9654; Save & Execute
                        </button>
                        <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="savePipeline()">
                            Save Only
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="panel right-panel" style="padding: 0;">
            <div class="execution-panel">
                <div class="execution-header">
                    <h3><span class="status-dot" id="status-dot" style="background: #6B7280;"></span> Execution</h3>
                    <span class="status-badge status-idle" id="execution-status-badge">Idle</span>
                </div>
                <div class="execution-log" id="results-content">
                    <div class="log-empty">
                        <div class="log-empty-icon">&#128736;</div>
                        <div>
                            <p style="font-weight: 500; color: var(--text-secondary); margin-bottom: 4px;">Ready to Execute</p>
                            <p style="font-size: 12px;">Build a pipeline and click "Save & Execute" to see results here.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let currentPipelineId = null;
        let ws = null;

        const tools = [
            'web_search', 'get_current_date', 'calculate',
            'calculate_statistics', 'read_file', 'list_directory',
            'write_file', 'count_words', 'extract_urls'
        ];

        // Load saved pipelines on page load
        document.addEventListener('DOMContentLoaded', loadPipelines);

        // Initialize with one node
        window.onload = function() {
            addNode();
        };

        async function loadPipelines() {
            try {
                const response = await fetch(`${API_BASE}/api/pipelines`);
                const pipelines = await response.json();

                const list = document.getElementById('pipeline-list');
                if (!pipelines || pipelines.length === 0) {
                    list.innerHTML = '<div class="log-empty" style="padding: 20px;"><p style="color: var(--text-muted); font-size: 13px;">No saved pipelines yet.</p></div>';
                    return;
                }

                list.innerHTML = pipelines.map(p => `
                    <div class="pipeline-item ${p.id === currentPipelineId ? 'active' : ''}"
                         onclick="loadPipeline('${p.id}')">
                        <div>
                            <div class="pipeline-name">${escapeHtml(p.name)}</div>
                            <div class="pipeline-date">${new Date(p.created_at).toLocaleDateString()}</div>
                        </div>
                        <button type="button" class="btn btn-danger btn-sm"
                                onclick="event.stopPropagation(); deletePipeline('${p.id}')">
                            Delete
                        </button>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load pipelines:', error);
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function loadPipeline(id) {
            try {
                const response = await fetch(`${API_BASE}/api/pipelines/${id}`);
                const pipeline = await response.json();

                currentPipelineId = id;
                document.getElementById('pipeline-name').value = pipeline.name;
                document.getElementById('pipeline-desc').value = pipeline.description || '';

                // Clear and rebuild nodes
                document.getElementById('nodes-container').innerHTML = '';
                pipeline.config.nodes.forEach(node => addNode(node));

                loadPipelines(); // Refresh active state
            } catch (error) {
                alert('Failed to load pipeline: ' + error.message);
            }
        }

        async function deletePipeline(id) {
            if (!confirm('Delete this pipeline?')) return;

            try {
                await fetch(`${API_BASE}/api/pipelines/${id}`, { method: 'DELETE' });
                if (currentPipelineId === id) {
                    currentPipelineId = null;
                    document.getElementById('pipeline-name').value = '';
                    document.getElementById('pipeline-desc').value = '';
                    document.getElementById('nodes-container').innerHTML = '';
                    addNode();
                }
                loadPipelines();
            } catch (error) {
                alert('Failed to delete: ' + error.message);
            }
        }

        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function addNode(data = null) {
            const container = document.getElementById('nodes-container');
            const nodeCount = container.children.length + 1;

            const nodeCard = document.createElement('div');
            nodeCard.className = 'node-card';

            const toolsHtml = tools.map(tool => `
                <label class="tool-toggle" for="tool-${tool}-${nodeCount}">
                    <input type="checkbox" id="tool-${tool}-${nodeCount}" class="tool-${tool}" value="${tool}"
                        ${data && data.tools && data.tools.includes(tool) ? 'checked' : ''}>
                    ${tool}
                </label>
            `).join('');

            nodeCard.innerHTML = `
                <div class="node-header">
                    <div class="node-badge">
                        <span class="number">${nodeCount}</span>
                        <span>Node</span>
                    </div>
                    <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('.node-card').remove()">
                        Remove
                    </button>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Node ID</label>
                        <input type="text" class="node-id mono" placeholder="e.g., extractor"
                            value="${data ? data.node_id : 'agent_'+nodeCount}">
                    </div>
                    <div class="form-group">
                        <label>Model</label>
                        <input type="text" class="node-model mono" placeholder="e.g., kimi-k2.5"
                            value="${data ? data.model : 'kimi-k2.5'}">
                    </div>
                </div>
                <div class="form-group">
                    <label>System Prompt</label>
                    <textarea class="node-prompt" placeholder="Define this agent's behavior...">${data ? data.system_prompt : ''}</textarea>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Temperature (0.0 - 2.0)</label>
                        <input type="number" class="node-temp mono" min="0" max="2" step="0.1"
                            value="${data ? data.temperature : 0.7}">
                    </div>
                </div>
                <div class="form-group">
                    <label>Available Tools</label>
                    <div class="tools-grid">
                        ${toolsHtml}
                    </div>
                </div>
            `;

            container.appendChild(nodeCard);
        }

        function getNodesData() {
            const nodes = [];
            const nodeCards = document.querySelectorAll('.node-card');

            nodeCards.forEach(card => {
                const nodeId = card.querySelector('.node-id').value;
                const toolsChecked = Array.from(card.querySelectorAll('.tools-grid input:checked'))
                    .map(cb => cb.value);

                nodes.push({
                    node_id: nodeId,
                    model: card.querySelector('.node-model').value,
                    system_prompt: card.querySelector('.node-prompt').value,
                    temperature: parseFloat(card.querySelector('.node-temp').value),
                    tools: toolsChecked,
                    max_tokens: null
                });
            });

            return nodes;
        }

        function buildEdges(nodes) {
            const edges = [];

            if (nodes.length > 0) {
                edges.push({ from: "START", to: nodes[0].node_id });
            }

            for (let i = 0; i < nodes.length - 1; i++) {
                edges.push({
                    from: nodes[i].node_id,
                    to: nodes[i + 1].node_id
                });
            }

            if (nodes.length > 0) {
                edges.push({ from: nodes[nodes.length - 1].node_id, to: "END" });
            }

            return edges;
        }

        const examples = {
            1: {
                name: "Research Pipeline",
                desc: "Extract entities, research with web search, then summarize",
                input: "What are the main challenges and opportunities in quantum computing for 2025?",
                nodes: [
                    {
                        node_id: "extractor",
                        model: "kimi-k2.5",
                        system_prompt: "You are an entity extractor. Identify key topics, entities, and concepts from the input. List them clearly and concisely.",
                        temperature: 0.0,
                        tools: []
                    },
                    {
                        node_id: "researcher",
                        model: "kimi-k2.5",
                        system_prompt: "You are a research analyst. Take the extracted entities and provide insights. Use web search to find current information.",
                        temperature: 0.7,
                        tools: ["web_search", "get_current_date"]
                    },
                    {
                        node_id: "summarizer",
                        model: "kimi-k2.5",
                        system_prompt: "You are a summarizer. Review all previous outputs and create a concise summary with key points as bullet points.",
                        temperature: 0.2,
                        tools: []
                    }
                ]
            },
            2: {
                name: "Code Review",
                desc: "Analyze code for issues, then generate recommendations",
                input: "Review this Python function:\n\ndef calculate(items):\n    total = 0\n    for i in range(len(items)):\n        total += items[i]['price'] * items[i]['quantity']\n    return total",
                nodes: [
                    {
                        node_id: "analyzer",
                        model: "kimi-k2.5",
                        system_prompt: "You are a code analyzer. Examine the provided code and identify: 1) Potential bugs, 2) Performance issues, 3) Style violations, 4) Security concerns. Be specific with line references.",
                        temperature: 0.3,
                        tools: []
                    },
                    {
                        node_id: "optimizer",
                        model: "kimi-k2.5",
                        system_prompt: "You are a code optimizer. Based on the issues found, provide an improved version of the code with explanations of what you changed and why.",
                        temperature: 0.5,
                        tools: []
                    },
                    {
                        node_id: "documenter",
                        model: "kimi-k2.5",
                        system_prompt: "You are a technical documenter. Create a brief summary document explaining: 1) Original issues, 2) Optimized solution, 3) Best practices demonstrated.",
                        temperature: 0.4,
                        tools: []
                    }
                ]
            },
            3: {
                name: "Data Processor",
                desc: "Validate data, calculate statistics, generate insights report",
                input: "Calculate statistics for these sales figures: 1200, 1450, 890, 2300, 1750, 980, 3100, 1420, 1680, 2050",
                nodes: [
                    {
                        node_id: "validator",
                        model: "kimi-k2.5",
                        system_prompt: "You are a data validator. Check if the provided data is valid numerical data. If valid, extract the comma or space-separated numbers. If invalid, explain why.",
                        temperature: 0.1,
                        tools: []
                    },
                    {
                        node_id: "calculator",
                        model: "kimi-k2.5",
                        system_prompt: "You are a statistics calculator. Use the calculate_statistics tool to compute mean, median, min, max, and count. Also calculate the sum manually using the calculate tool.",
                        temperature: 0.0,
                        tools: ["calculate", "calculate_statistics"]
                    },
                    {
                        node_id: "reporter",
                        model: "kimi-k2.5",
                        system_prompt: "You are a report generator. Format the statistics into a professional summary with insights about the data distribution and any notable patterns.",
                        temperature: 0.3,
                        tools: []
                    }
                ]
            }
        };

        function loadExample(num) {
            const ex = examples[num];
            if (!ex) return;

            document.getElementById('pipeline-name').value = ex.name;
            document.getElementById('pipeline-desc').value = ex.desc;
            document.getElementById('test-input').value = ex.input;

            document.getElementById('nodes-container').innerHTML = '';
            ex.nodes.forEach(node => addNode(node));

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function savePipeline() {
            const nodes = getNodesData();

            if (nodes.length === 0) {
                alert('Please add at least one agent node');
                return;
            }

            const name = document.getElementById('pipeline-name').value || 'Unnamed Pipeline';
            const description = document.getElementById('pipeline-desc').value;

            const config = {
                graph_name: name.toLowerCase().replace(/\s+/g, '_'),
                version: "1.0.0",
                description: description,
                state: {
                    fields: [
                        { name: "messages", type: "List[BaseMessage]", reducer: "operator.add" },
                        { name: "current_node", type: "str", default: "" },
                        { name: "iteration_count", type: "int", default: 0 }
                    ]
                },
                nodes: nodes,
                edges: buildEdges(nodes),
                entry_point: "START"
            };

            try {
                const response = await fetch(`${API_BASE}/api/pipelines`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, config })
                });

                if (!response.ok) throw new Error('Failed to save');

                const result = await response.json();
                currentPipelineId = result.id;
                alert('Pipeline saved!');
                loadPipelines();
            } catch (error) {
                alert('Failed to save: ' + error.message);
            }
        }

        async function saveAndExecute() {
            const nodes = getNodesData();

            if (nodes.length === 0) {
                alert('Please add at least one agent node');
                return;
            }

            const name = document.getElementById('pipeline-name').value || 'Unnamed Pipeline';
            const description = document.getElementById('pipeline-desc').value;
            const userInput = document.getElementById('test-input').value || 'Hello';

            const config = {
                graph_name: name.toLowerCase().replace(/\s+/g, '_'),
                version: "1.0.0",
                description: description,
                state: {
                    fields: [
                        { name: "messages", type: "List[BaseMessage]", reducer: "operator.add" },
                        { name: "current_node", type: "str", default: "" },
                        { name: "iteration_count", type: "int", default: 0 }
                    ]
                },
                nodes: nodes,
                edges: buildEdges(nodes),
                entry_point: "START"
            };

            try {
                const saveResponse = await fetch(`${API_BASE}/api/pipelines`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description, config })
                });

                if (!saveResponse.ok) throw new Error('Failed to save');

                const pipeline = await saveResponse.json();
                currentPipelineId = pipeline.id;
                loadPipelines();

                const execResponse = await fetch(`${API_BASE}/api/pipelines/${pipeline.id}/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: userInput })
                });

                if (!execResponse.ok) throw new Error('Failed to start execution');

                const execution = await execResponse.json();
                connectWebSocket(execution.id);

            } catch (error) {
                alert('Failed: ' + error.message);
            }
        }

        function connectWebSocket(executionId) {
            if (ws) {
                ws.close();
            }

            // Update status
            setExecutionStatus('running', 'Running...');
            const resultsContent = document.getElementById('results-content');
            resultsContent.innerHTML = '';

            const wsUrl = `ws://${window.location.host}/ws/execute/${executionId}`;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                console.log('WebSocket connected');
            };

            ws.onmessage = function(event) {
                const data = JSON.parse(event.data);
                handleWebSocketMessage(data);
            };

            ws.onerror = function(error) {
                console.error('WebSocket error:', error);
                setExecutionStatus('error', 'Error');
            };

            ws.onclose = function() {
                console.log('WebSocket closed');
            };
        }

        function setExecutionStatus(status, label) {
            const badge = document.getElementById('execution-status-badge');
            const dot = document.getElementById('status-dot');

            badge.className = 'status-badge status-' + status;
            badge.textContent = label;

            if (status === 'running') {
                dot.style.background = 'var(--accent-blue)';
                dot.style.animation = 'pulse-dot 1.5s ease-in-out infinite';
            } else if (status === 'complete') {
                dot.style.background = 'var(--accent-green)';
                dot.style.animation = 'none';
            } else if (status === 'error') {
                dot.style.background = 'var(--accent-red)';
                dot.style.animation = 'none';
            } else {
                dot.style.background = '#6B7280';
                dot.style.animation = 'none';
            }
        }

        function handleWebSocketMessage(data) {
            const resultsContent = document.getElementById('results-content');

            switch (data.type) {
                case 'execution_start':
                    resultsContent.innerHTML += createStepCard({
                        icon: '&#9654;',
                        iconClass: 'info',
                        title: 'Execution Started',
                        meta: escapeHtml(data.pipeline_name),
                        body: 'Pipeline initialized and running...'
                    });
                    break;

                case 'node_start':
                    resultsContent.innerHTML += createStepCard({
                        id: `node-${data.node_id}`,
                        icon: '&#9881;',
                        iconClass: 'running',
                        title: `Node: ${escapeHtml(data.node_id)}`,
                        body: 'Processing input...',
                        running: true
                    });
                    break;

                case 'node_complete': {
                    const nodeEl = document.getElementById(`node-${data.node_id}`);
                    if (nodeEl) {
                        const icon = nodeEl.querySelector('.step-icon');
                        icon.className = 'step-icon complete';
                        icon.innerHTML = '&#10003;';

                        const title = nodeEl.querySelector('.step-title');
                        title.textContent = `Node: ${escapeHtml(data.node_id)}`;

                        const meta = nodeEl.querySelector('.step-meta');
                        if (meta) meta.textContent = `${data.duration_ms || 0}ms`;

                        const body = nodeEl.querySelector('.step-body');
                        let toolsUsed = '';
                        if (data.tools && data.tools.length > 0) {
                            toolsUsed = `<div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);">
                                <span style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em;">Tools Used</span>
                                <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px;">
                                    ${data.tools.map(t => `<span class="tool-tag" style="background: var(--bg-hover); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 11px; font-family: var(--font-mono); color: var(--text-accent);">${t}</span>`).join('')}
                                </div>
                            </div>`;
                        }
                        body.innerHTML = `<div class="mono">${formatOutput(data.output)}</div>${toolsUsed}`;
                    }
                    break;
                }

                case 'tool_call_start': {
                    const toolId = `tool-${data.tool}-${Date.now()}`;
                    const toolCard = document.createElement('div');
                    toolCard.id = toolId;
                    toolCard.className = 'tool-card running';
                    const inputStr = data.input !== undefined && data.input !== null
                        ? formatJson(data.input)
                        : 'N/A';
                    toolCard.innerHTML = `
                        <div class="tool-header">
                            <div class="tool-icon running">&#9881;</div>
                            <span class="tool-name">${escapeHtml(data.tool)}</span>
                            <span class="tool-status-label running">Running</span>
                        </div>
                        <div class="tool-body">
                            <div class="tool-param">
                                <div class="tool-param-label">Input</div>
                                <div class="tool-param-value mono">${inputStr}</div>
                            </div>
                        </div>
                    `;
                    resultsContent.appendChild(toolCard);
                    break;
                }

                case 'tool_call_end': {
                    // Find the most recent running tool card for this tool name
                    const toolCards = Array.from(resultsContent.querySelectorAll('.tool-card.running'));
                    let targetCard = toolCards.reverse().find(card => {
                        const nameEl = card.querySelector('.tool-name');
                        return nameEl && nameEl.textContent.trim() === data.tool;
                    });

                    // If not found, create one
                    if (!targetCard) {
                        targetCard = document.createElement('div');
                        targetCard.className = 'tool-card';
                        resultsContent.appendChild(targetCard);
                    }

                    const hasError = !!data.error;
                    targetCard.className = `tool-card ${hasError ? 'error' : 'success'}`;

                    const inputStr = data.input !== undefined && data.input !== null
                        ? formatJson(data.input)
                        : 'N/A';
                    const outputStr = hasError ? data.error : formatJson(data.output);
                    const outputLabel = hasError ? 'Error' : 'Output';

                    targetCard.innerHTML = `
                        <div class="tool-header">
                            <div class="tool-icon ${hasError ? 'error' : 'success'}">${hasError ? '&#10007;' : '&#10003;'}</div>
                            <span class="tool-name">${escapeHtml(data.tool)}</span>
                            <span class="tool-status-label ${hasError ? 'error' : 'success'}">${hasError ? 'Failed' : 'Completed'}</span>
                        </div>
                        <div class="tool-body">
                            <div class="tool-param">
                                <div class="tool-param-label">Input</div>
                                <div class="tool-param-value mono">${inputStr}</div>
                            </div>
                            <div class="tool-param">
                                <div class="tool-param-label">${outputLabel}</div>
                                <div class="tool-param-value mono" id="${targetCard.id}-output-visible">
                                    ${truncateText(outputStr, 3)}
                                </div>
                                <div class="tool-raw-output" id="${targetCard.id}-raw">
                                    <div class="tool-param-value mono"><pre>${escapeHtml(outputStr)}</pre></div>
                                </div>
                                ${shouldCollapse(outputStr, 3) ? `<button type="button" class="tool-toggle-raw" onclick="toggleRaw('${targetCard.id}-raw', this)">
                                    <span>&#128229;</span> View Full Output
                                </button>` : ''}
                            </div>
                        </div>
                    `;
                    break;
                }

                case 'complete':
                    setExecutionStatus('complete', 'Complete');
                    resultsContent.innerHTML += `
                        <div class="final-output-card">
                            <div class="final-header">
                                <div class="final-title">&#10003; Final Output</div>
                                <div class="final-meta">${data.total_duration_ms || 0}ms &middot; ${data.nodes_executed || 0} nodes</div>
                            </div>
                            <div class="final-body">${formatOutput(data.final_output)}</div>
                        </div>
                    `;
                    break;

                case 'error':
                    setExecutionStatus('error', 'Failed');
                    resultsContent.innerHTML += createStepCard({
                        icon: '&#10007;',
                        iconClass: 'error',
                        title: 'Execution Failed',
                        body: escapeHtml(data.message)
                    });
                    break;
            }

            resultsContent.scrollTop = resultsContent.scrollHeight;
        }

        function createStepCard({ id, icon, iconClass, title, meta, body, running }) {
            const cardId = id ? `id="${id}"` : '';
            const metaHtml = meta ? `<div class="step-meta">${escapeHtml(meta)}</div>` : '';
            return `
                <div class="step-card" ${cardId}>
                    <div class="step-header-bar">
                        <div class="step-icon ${iconClass || 'info'}">${icon}</div>
                        <div class="step-title">${escapeHtml(title)}</div>
                        ${metaHtml}
                    </div>
                    ${body ? `<div class="step-body">${body}</div>` : ''}
                </div>
            `;
        }

        function formatJson(val) {
            if (val === undefined || val === null) return 'N/A';
            if (typeof val === 'string') {
                // If it's already a string, show it directly (but limit length)
                if (val.length > 500) {
                    return escapeHtml(val.substring(0, 500)) + '... (truncated)';
                }
                return escapeHtml(val);
            }
            if (typeof val === 'object') {
                try {
                    // Handle circular references
                    const seen = new WeakSet();
                    const sanitized = JSON.parse(JSON.stringify(val, (key, value) => {
                        if (typeof value === 'object' && value !== null) {
                            if (seen.has(value)) {
                                return '[Circular]';
                            }
                            seen.add(value);
                        }
                        return value;
                    }));
                    return escapeHtml(JSON.stringify(sanitized, null, 2));
                } catch (e) {
                    // Fallback: try to show key info
                    try {
                        return escapeHtml(Object.keys(val).map(k => `${k}: ${typeof val[k]}`).join(', '));
                    } catch {
                        return escapeHtml(String(val));
                    }
                }
            }
            return escapeHtml(String(val));
        }

        function escapeHtml(text) {
            if (text === undefined || text === null) return '';
            const div = document.createElement('div');
            div.textContent = String(text);
            return div.innerHTML;
        }

        function formatOutput(text) {
            if (!text) return '';
            // Simple markdown-like formatting
            let html = escapeHtml(text)
                .replace(/\n/g, '<br>');
            return html;
        }

        function shouldCollapse(text, maxLines) {
            if (!text) return false;
            const lines = text.split('\n');
            return lines.length > maxLines || text.length > 300;
        }

        function truncateText(text, maxLines) {
            if (!text) return '';
            const lines = text.split('\n');
            if (lines.length > maxLines) {
                return escapeHtml(lines.slice(0, maxLines).join('\n')) + '<span style="color: var(--text-muted);">\n... (' + (lines.length - maxLines) + ' more lines)</span>';
            }
            return escapeHtml(text);
        }

        function toggleRaw(rawId, btn) {
            const raw = document.getElementById(rawId);
            if (!raw) return;
            const isExpanded = raw.classList.contains('expanded');
            if (isExpanded) {
                raw.classList.remove('expanded');
                btn.innerHTML = '<span>&#128229;</span> View Full Output';
            } else {
                raw.classList.add('expanded');
                btn.innerHTML = '<span>&#128230;</span> Hide Full Output';
            }
        }
    </script>
</body>
