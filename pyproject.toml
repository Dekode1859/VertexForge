[project]
name = "vertexforge"
version = "0.1.0"
description = "JSON-to-LangGraph compiler with bidirectional translation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "langgraph==1.1.9",
    "langchain-core==1.3.2",
    "langchain-ollama==1.1.0",
    "pydantic==2.13.3",
    "python-dotenv==1.2.2",
    "requests==2.33.1",
    "duckduckgo-search==8.1.1",
    "arize-phoenix-otel==0.15.0",
    "arize-phoenix-client==1.21.0",
    "openinference-instrumentation-langchain==0.1.43",
    "openpyxl==3.1.5",
    "pypdf==5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "black==26.3.1",
    "ruff==0.15.12",
    "mypy==1.20.2",
]
web = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "gunicorn==23.0.0",
    "websockets==16.0",
    "python-multipart==0.0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vertexforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

